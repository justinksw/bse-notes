<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="BSE Notes">
  <rect width="64" height="64" rx="14" fill="#1E2A50"/>
  <!-- notebook body -->
  <rect x="16" y="12" width="32" height="40" rx="4" fill="none" stroke="#EEF1F4" stroke-width="2.25"/>
  <!-- spine accent -->
  <line x1="22" y1="12" x2="22" y2="52" stroke="#C45C26" stroke-width="2.25" stroke-linecap="round"/>
  <!-- note lines -->
  <line x1="28" y1="24" x2="42" y2="24" stroke="#EEF1F4" stroke-width="2" stroke-linecap="round"/>
  <line x1="28" y1="32" x2="42" y2="32" stroke="#EEF1F4" stroke-width="2" stroke-linecap="round"/>
  <line x1="28" y1="40" x2="38" y2="40" stroke="#90A0C4" stroke-width="2" stroke-linecap="round"/>
</svg>
