<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 210" role="img" aria-label="D5 Pre-action 雙連鎖 一房一閥組">
  <defs>
    <marker id="a5" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1E2A50"/>
    </marker>
  </defs>
  <rect width="520" height="210" fill="#FFFFFF"/>
  <!-- Wet top -->
  <text x="20" y="22" font-family="Noto Sans CJK TC,sans-serif" font-size="12" font-weight="700" fill="#C45C26">濕式</text>
  <rect x="70" y="8" width="100" height="32" rx="3" fill="#EEF1F4" stroke="#1E2A50" stroke-width="1.4"/>
  <text x="120" y="28" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="11" font-weight="700" fill="#1E2A50">管內有水</text>
  <line x1="170" y1="24" x2="200" y2="24" stroke="#1E2A50" stroke-width="2" marker-end="url(#a5)"/>
  <rect x="205" y="8" width="90" height="32" rx="3" fill="#EEF1F4" stroke="#1E2A50" stroke-width="1.4"/>
  <text x="250" y="28" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="11" font-weight="700" fill="#1E2A50">噴頭開</text>
  <line x1="295" y1="24" x2="325" y2="24" stroke="#1E2A50" stroke-width="2" marker-end="url(#a5)"/>
  <rect x="330" y="8" width="80" height="32" rx="3" fill="#FFF4E5" stroke="#C45C26" stroke-width="1.4"/>
  <text x="370" y="28" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="11" font-weight="700" fill="#C45C26">出水</text>
  <!-- Pre-action bottom -->
  <text x="20" y="78" font-family="Noto Sans CJK TC,sans-serif" font-size="12" font-weight="700" fill="#C45C26">Pre-action</text>
  <rect x="20" y="90" width="110" height="36" rx="3" fill="#F7F4F0" stroke="#1E2A50" stroke-width="1.4"/>
  <text x="75" y="112" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="11" font-weight="700" fill="#1E2A50">管乾／監管氣</text>
  <line x1="130" y1="108" x2="155" y2="108" stroke="#1E2A50" stroke-width="2" marker-end="url(#a5)"/>
  <!-- AND gate -->
  <rect x="158" y="78" width="130" height="60" rx="4" fill="#FFFFFF" stroke="#1E2A50" stroke-width="2"/>
  <text x="223" y="98" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="10" font-weight="700" fill="#5C6575">AND</text>
  <rect x="168" y="105" width="50" height="24" rx="2" fill="#EEF1F4" stroke="#1E2A50" stroke-width="1.2"/>
  <text x="193" y="121" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="10" font-weight="700" fill="#1E2A50">條件A</text>
  <text x="223" y="121" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="12" font-weight="700" fill="#C45C26">＋</text>
  <rect x="236" y="105" width="42" height="24" rx="2" fill="#EEF1F4" stroke="#1E2A50" stroke-width="1.2"/>
  <text x="257" y="121" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="10" font-weight="700" fill="#1E2A50">條件B</text>
  <line x1="288" y1="108" x2="318" y2="108" stroke="#1E2A50" stroke-width="2" marker-end="url(#a5)"/>
  <rect x="320" y="90" width="80" height="36" rx="3" fill="#EEF1F4" stroke="#1E2A50" stroke-width="1.4"/>
  <text x="360" y="112" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="11" font-weight="700" fill="#1E2A50">閥開入水</text>
  <line x1="400" y1="108" x2="430" y2="108" stroke="#1E2A50" stroke-width="2" marker-end="url(#a5)"/>
  <rect x="432" y="90" width="70" height="36" rx="3" fill="#FFF4E5" stroke="#C45C26" stroke-width="1.4"/>
  <text x="467" y="112" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="11" font-weight="700" fill="#C45C26">出水</text>
  <text x="260" y="168" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="12" font-weight="700" fill="#1E2A50">雙連鎖＝兩獨立條件齊（AND · 唔係 OR）</text>
  <rect x="90" y="178" width="340" height="24" rx="4" fill="#FFF4E5" stroke="#C45C26" stroke-width="1.2"/>
  <text x="260" y="195" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="11" font-weight="700" fill="#C45C26">高敏感房：一房一閥組（跟圖）</text>
</svg>
