<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" role="img" aria-label="D0 系統總圖 六塊">
  <defs>
    <marker id="a0" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1E2A50"/>
    </marker>
  </defs>
  <rect width="520" height="220" fill="#FFFFFF"/>

  <!-- mutual-drag hints: short dashed arcs ONLY in gaps between boxes (no ellipse through boxes) -->
  <path d="M132,55 Q160,90 188,100" fill="none" stroke="#C45C26" stroke-width="1.4" stroke-dasharray="4 3" opacity="0.7"/>
  <path d="M332,100 Q360,90 388,55" fill="none" stroke="#C45C26" stroke-width="1.4" stroke-dasharray="4 3" opacity="0.7"/>
  <path d="M332,120 Q360,130 388,165" fill="none" stroke="#C45C26" stroke-width="1.4" stroke-dasharray="4 3" opacity="0.7"/>
  <path d="M132,165 Q160,130 188,120" fill="none" stroke="#C45C26" stroke-width="1.4" stroke-dasharray="4 3" opacity="0.7"/>

  <!-- center controlled/clean supply space -->
  <rect x="188" y="74" width="144" height="68" rx="6" fill="#FFF4E5" stroke="#C45C26" stroke-width="2.4"/>
  <text x="260" y="100" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="12" font-weight="700" fill="#C45C26">受控／潔淨</text>
  <text x="260" y="118" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="12" font-weight="700" fill="#C45C26">送風空間</text>

  <!-- top: 風 MVAC -->
  <rect x="205" y="10" width="110" height="40" rx="4" fill="#F7F4F0" stroke="#1E2A50" stroke-width="1.8"/>
  <text x="260" y="28" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="13" font-weight="700" fill="#1E2A50">風 MVAC</text>
  <text x="260" y="42" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="9.5" fill="#5C6575">AHU→房</text>
  <line x1="260" y1="50" x2="260" y2="72" stroke="#1E2A50" stroke-width="2" marker-end="url(#a0)"/>

  <!-- top-right: 水 -->
  <rect x="400" y="42" width="104" height="40" rx="4" fill="#EEF1F4" stroke="#1E2A50" stroke-width="1.8"/>
  <text x="452" y="60" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="13" font-weight="700" fill="#1E2A50">水</text>
  <text x="452" y="74" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="9.5" fill="#5C6575">冷水機→盤管</text>
  <line x1="400" y1="70" x2="324" y2="98" stroke="#1E2A50" stroke-width="2" marker-end="url(#a0)"/>
  <!-- 水→風 label in clear top gap -->
  <path d="M412,42 Q355,16 320,28" fill="none" stroke="#C45C26" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="362" y="20" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="9" font-weight="700" fill="#C45C26">水→風</text>

  <!-- bottom-right: 火 -->
  <rect x="400" y="134" width="104" height="40" rx="4" fill="#EEF1F4" stroke="#1E2A50" stroke-width="1.8"/>
  <text x="452" y="152" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="13" font-weight="700" fill="#1E2A50">火</text>
  <text x="452" y="166" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="9.5" fill="#5C6575">探測→滅火／聯鎖</text>
  <line x1="400" y1="146" x2="324" y2="120" stroke="#1E2A50" stroke-width="2" marker-end="url(#a0)"/>

  <!-- bottom: 醫氣 — 20px clear to viewBox bottom -->
  <rect x="205" y="166" width="110" height="40" rx="4" fill="#EEF1F4" stroke="#1E2A50" stroke-width="1.8"/>
  <text x="260" y="184" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="13" font-weight="700" fill="#1E2A50">醫氣</text>
  <text x="260" y="198" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="9.5" fill="#5C6575">riser→AVSU→終端</text>
  <line x1="260" y1="166" x2="260" y2="144" stroke="#1E2A50" stroke-width="2" marker-end="url(#a0)"/>

  <!-- bottom-left: CCMS -->
  <rect x="16" y="134" width="104" height="40" rx="4" fill="#EEF1F4" stroke="#1E2A50" stroke-width="1.8"/>
  <text x="68" y="152" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="13" font-weight="700" fill="#1E2A50">CCMS</text>
  <text x="68" y="166" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="9.5" fill="#5C6575">感應→警報／畫面</text>
  <line x1="120" y1="146" x2="196" y2="120" stroke="#1E2A50" stroke-width="2" marker-end="url(#a0)"/>

  <!-- top-left: 電 -->
  <rect x="16" y="42" width="104" height="40" rx="4" fill="#EEF1F4" stroke="#1E2A50" stroke-width="1.8"/>
  <text x="68" y="60" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="13" font-weight="700" fill="#1E2A50">電</text>
  <text x="68" y="74" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="9.5" fill="#5C6575">N／E／UPS</text>
  <line x1="120" y1="70" x2="196" y2="98" stroke="#1E2A50" stroke-width="2" marker-end="url(#a0)"/>
</svg>
