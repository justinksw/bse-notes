<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 175" role="img" aria-label="D3 CAV vs VAV">
  <rect width="520" height="175" fill="#FFFFFF"/>
  <!-- CAV -->
  <rect x="12" y="18" width="230" height="140" rx="5" fill="#F7F4F0" stroke="#1E2A50" stroke-width="2"/>
  <text x="127" y="42" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="14" font-weight="700" fill="#1E2A50">CAV</text>
  <text x="127" y="60" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="11" fill="#C45C26" font-weight="700">定風量 · 鎖 ΔP</text>
  <!-- fixed flow arrows -->
  <line x1="40" y1="85" x2="120" y2="85" stroke="#1E2A50" stroke-width="4"/>
  <polygon points="120,78 138,85 120,92" fill="#1E2A50"/>
  <line x1="40" y1="105" x2="120" y2="105" stroke="#1E2A50" stroke-width="4"/>
  <polygon points="120,98 138,105 120,112" fill="#1E2A50"/>
  <text x="88" y="128" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="10" fill="#1E2A50">風量固定</text>
  <rect x="150" y="72" width="78" height="48" rx="3" fill="#FFFFFF" stroke="#1E2A50" stroke-width="1.3"/>
  <text x="189" y="92" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="10" font-weight="700" fill="#1E2A50">再熱</text>
  <text x="189" y="107" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="10" fill="#1E2A50">／水閥</text>
  <text x="127" y="148" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="10" fill="#5C6575">ΔP 箭嘴穩</text>
  <!-- VAV -->
  <rect x="278" y="18" width="230" height="140" rx="5" fill="#EEF1F4" stroke="#C45C26" stroke-width="2"/>
  <text x="393" y="42" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="14" font-weight="700" fill="#1E2A50">VAV</text>
  <text x="393" y="60" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="11" fill="#C45C26" font-weight="700">變風量 · ΔP 難穩</text>
  <line x1="300" y1="82" x2="360" y2="82" stroke="#1E2A50" stroke-width="5"/>
  <polygon points="360,74 382,82 360,90" fill="#1E2A50"/>
  <line x1="300" y1="108" x2="340" y2="108" stroke="#1E2A50" stroke-width="2"/>
  <polygon points="340,102 354,108 340,114" fill="#1E2A50"/>
  <text x="340" y="128" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="10" fill="#1E2A50">風量變粗變幼</text>
  <text x="393" y="148" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="10" fill="#C45C26" font-weight="700">ΔP 跟著抖</text>
</svg>
