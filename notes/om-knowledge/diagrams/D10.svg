<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 175" role="img" aria-label="D10 排風／污側方向">
  <rect width="520" height="175" fill="#FFFFFF"/>
  <rect x="16" y="40" width="140" height="90" rx="5" fill="#F0F5F8" stroke="#1E2A50" stroke-width="2"/>
  <text x="86" y="72" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="12" font-weight="700" fill="#1E2A50">高要求受控房</text>
  <text x="86" y="92" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="11" fill="#C45C26" font-weight="700">正壓</text>
  <text x="86" y="112" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="10" fill="#5C6575">受控送風 AHU</text>
  <line x1="156" y1="85" x2="200" y2="85" stroke="#1E2A50" stroke-width="2.5"/>
  <polygon points="200,78 216,85 200,92" fill="#1E2A50"/>
  <text x="186" y="72" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="10" font-weight="700" fill="#C45C26">潔淨→污</text>
  <rect x="220" y="50" width="100" height="70" rx="5" fill="#EEF1F4" stroke="#1E2A50" stroke-width="1.5"/>
  <text x="270" y="88" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="12" font-weight="700" fill="#1E2A50">走廊</text>
  <text x="270" y="106" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="10" fill="#5C6575">較低壓</text>
  <line x1="320" y1="85" x2="364" y2="85" stroke="#1E2A50" stroke-width="2.5"/>
  <polygon points="364,78 380,85 364,92" fill="#1E2A50"/>
  <rect x="384" y="40" width="120" height="90" rx="5" fill="#FFF4E5" stroke="#C45C26" stroke-width="2"/>
  <text x="444" y="72" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="12" font-weight="700" fill="#1E2A50">污側／氣味源</text>
  <text x="444" y="94" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="11" fill="#C45C26" font-weight="700">專用排風機(EAF)</text>
  <line x1="444" y1="40" x2="444" y2="18" stroke="#C45C26" stroke-width="2.5"/>
  <polygon points="437,22 444,10 451,22" fill="#C45C26"/>
  <text x="444" y="148" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="10" fill="#5C6575">排走上／出屋</text>
  <text x="260" y="168" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="10" font-weight="700" fill="#1E2A50">送風鎖潔淨正壓；專用排風鎖污側</text>
</svg>
