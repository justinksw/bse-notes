  <text x="52" y="80" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="13" font-weight="700" fill="#1E2A50">感應器</text>
  <line x1="92" y1="75" x2="118" y2="75" stroke="#1E2A50" stroke-width="2" marker-end="url(#a0f)"/>
