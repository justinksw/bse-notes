<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 230" role="img" aria-label="D11 火警風機停機矩陣">
  <defs>
    <marker id="a11" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1E2A50"/>
    </marker>
  </defs>
  <rect width="520" height="230" fill="#FFFFFF"/>
  <text x="260" y="22" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="12" font-weight="700" fill="#5C6575">探測／分區 → 送／排停機／閘關（對獲批聯鎖表）</text>

  <!-- Left column: detection -->
  <rect x="16" y="40" width="130" height="130" rx="6" fill="#F7F4F0" stroke="#1E2A50" stroke-width="2"/>
  <text x="81" y="68" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="13" font-weight="700" fill="#1E2A50">探測／分區</text>
  <rect x="28" y="82" width="106" height="26" rx="3" fill="#EEF1F4" stroke="#1E2A50" stroke-width="1.2"/>
  <text x="81" y="100" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="11" fill="#1E2A50">煙感／熱感</text>
  <rect x="28" y="116" width="106" height="26" rx="3" fill="#EEF1F4" stroke="#1E2A50" stroke-width="1.2"/>
  <text x="81" y="134" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="11" fill="#1E2A50">分區訊號</text>
  <text x="81" y="158" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="10" fill="#5C6575">跟獲批矩陣</text>

  <!-- arrows -->
  <line x1="146" y1="80" x2="196" y2="60" stroke="#1E2A50" stroke-width="2" marker-end="url(#a11)"/>
  <line x1="146" y1="105" x2="196" y2="105" stroke="#1E2A50" stroke-width="2" marker-end="url(#a11)"/>
  <line x1="146" y1="130" x2="196" y2="150" stroke="#1E2A50" stroke-width="2" marker-end="url(#a11)"/>

  <!-- Right outcomes -->
  <rect x="200" y="40" width="150" height="40" rx="4" fill="#FFF4E5" stroke="#C45C26" stroke-width="1.8"/>
  <text x="275" y="65" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="12" font-weight="700" fill="#C45C26">送風機停</text>
  <rect x="200" y="90" width="150" height="40" rx="4" fill="#FFF4E5" stroke="#C45C26" stroke-width="1.8"/>
  <text x="275" y="115" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="12" font-weight="700" fill="#C45C26">排風機停</text>
  <rect x="200" y="140" width="150" height="40" rx="4" fill="#EEF1F4" stroke="#1E2A50" stroke-width="1.8"/>
  <text x="275" y="165" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="12" font-weight="700" fill="#1E2A50">MSFD／防火閘關</text>

  <!-- Side note box — NOT D9 gas sequence -->
  <rect x="368" y="40" width="136" height="140" rx="6" fill="#FFFFFF" stroke="#C45C26" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="436" y="68" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="11" font-weight="700" fill="#C45C26">另見 D9</text>
  <text x="436" y="92" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="10" fill="#5C6575">氣體房放氣</text>
  <text x="436" y="110" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="10" fill="#5C6575">序列／hold time</text>
  <text x="436" y="136" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="10" fill="#1E2A50">本圖＝整區</text>
  <text x="436" y="154" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="10" fill="#1E2A50">送／排停機網</text>
  <text x="436" y="172" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="10" fill="#5C6575">唔係放氣時間線</text>

  <rect x="40" y="192" width="440" height="28" rx="4" fill="#FFF4E5" stroke="#C45C26" stroke-width="1.2"/>
  <text x="260" y="211" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="12" font-weight="700" fill="#1E2A50">探測可令整區風停；對矩陣，恢復後清 inhibit</text>
</svg>
