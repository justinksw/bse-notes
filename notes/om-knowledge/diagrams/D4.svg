<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" role="img" aria-label="D4 風冷冷水機冷凍循環">
  <defs>
    <marker id="a4" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1E2A50"/>
    </marker>
    <marker id="a4o" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#C45C26"/>
    </marker>
  </defs>
  <rect width="520" height="180" fill="#FFFFFF"/>
  <!-- compressor -->
  <rect x="30" y="20" width="90" height="48" rx="4" fill="#F7F4F0" stroke="#1E2A50" stroke-width="1.8"/>
  <text x="75" y="48" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="12" font-weight="700" fill="#1E2A50">壓縮機</text>
  <line x1="120" y1="44" x2="148" y2="44" stroke="#1E2A50" stroke-width="2" marker-end="url(#a4)"/>
  <!-- condenser -->
  <rect x="150" y="12" width="120" height="64" rx="4" fill="#EEF1F4" stroke="#1E2A50" stroke-width="1.8"/>
  <text x="210" y="38" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="12" font-weight="700" fill="#1E2A50">冷凝器</text>
  <text x="210" y="56" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="10" fill="#C45C26" font-weight="700">室外風扇散熱</text>
  <line x1="270" y1="44" x2="298" y2="44" stroke="#1E2A50" stroke-width="2" marker-end="url(#a4)"/>
  <!-- expansion -->
  <rect x="300" y="20" width="80" height="48" rx="4" fill="#F7F4F0" stroke="#1E2A50" stroke-width="1.8"/>
  <text x="340" y="48" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="12" font-weight="700" fill="#1E2A50">膨脹</text>
  <line x1="380" y1="44" x2="408" y2="44" stroke="#1E2A50" stroke-width="2" marker-end="url(#a4)"/>
  <!-- evaporator -->
  <rect x="410" y="12" width="95" height="64" rx="4" fill="#FFF4E5" stroke="#C45C26" stroke-width="1.8"/>
  <text x="457" y="48" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="12" font-weight="700" fill="#1E2A50">蒸發器</text>
  <!-- CHW loop -->
  <line x1="457" y1="76" x2="457" y2="100" stroke="#C45C26" stroke-width="2" marker-end="url(#a4o)"/>
  <rect x="300" y="105" width="190" height="50" rx="4" fill="#FFFFFF" stroke="#C45C26" stroke-width="1.8"/>
  <text x="395" y="126" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="11" font-weight="700" fill="#C45C26">冷凍水 → AHU 盤管</text>
  <text x="395" y="144" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="10" fill="#5C6575">供 → 盤管 → 回水</text>
  <!-- warn -->
  <rect x="30" y="105" width="240" height="50" rx="4" fill="#FFF4E5" stroke="#C45C26" stroke-width="1.3"/>
  <text x="150" y="128" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="11" font-weight="700" fill="#1E2A50">⚠ 氣流短路＝排熱吸返入</text>
  <text x="150" y="145" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="10" fill="#5C6575">室外盤管要通風同乾淨</text>
</svg>
